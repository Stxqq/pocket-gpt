[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-gpt"
version = "0.1.0"
description = "A GPT trained from scratch in pure NumPy on a tiny autograd engine."
readme = "README.md"
license = "MIT"
authors = [{ name = "Stefan Carapic" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://stxqq.github.io/pocket-gpt/"
Source = "https://github.com/Stxqq/pocket-gpt"

[tool.setuptools]
packages = ["pocketgpt"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
